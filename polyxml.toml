[workspace]
name = "anduril-lattice-uci-bridge"
schemas = ["schemas/uci/uci_entity_core.xsd"]
output_base_dir = "generated"
custom_header = "// CLASSIFICATION: UNCLASSIFIED // NATO STANAG / UCI Telemetry // Generated by PolyXML."

[[generate]]
target = "rust"
output = "rust"
zero_copy = true
codecs = true
features = ["rkyv"]

[[generate]]
target = "python"
output = "python"
backend = "dataclass"
codecs = true

[[generate]]
target = "python"
output = "python_aot"
backend = "aot"
package = "uci_aot"

[[generate]]
target = "go"
output = "go"
package = "uci"

[[generate]]
target = "cpp"
output = "cpp"

[[generate]]
target = "java"
output = "java"
package = "com.enterprise.uci"

[[generate]]
target = "typescript"
output = "typescript"
backend = "zod"

[[generate]]
target = "csharp"
output = "csharp"
namespace = "Enterprise.Uci"
backend = "source-gen"

